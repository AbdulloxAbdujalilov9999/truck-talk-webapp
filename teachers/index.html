<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truck Talk Teachers</title>
<meta name="theme-color" content="#1A3D63" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D2140" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.55;
  }
  h1,h2,h3{ font-family:var(--font-display); text-wrap:balance; margin:0; font-weight:600; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:var(--accent); }
  ::selection{ background:var(--accent); color:var(--accent-ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{ -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  input, select, textarea{ font-size:16px; }

  /* ---------- Header ---------- */
  .topbar{
    background:var(--header-bg); color:var(--header-ink);
    padding:calc(12px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 12px max(20px, env(safe-area-inset-left));
    display:flex; align-items:center; justify-content:center;
  }
  .topbar-inner{ width:100%; max-width:1320px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-logo{ width:34px; height:34px; border-radius:10px; flex-shrink:0; display:block; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.1; min-width:0; }
  .brand-mark{ font-family:var(--font-display); font-weight:700; font-size:1.3rem; letter-spacing:0.05em; color:#fff; }
  .brand-sub{ font-family:var(--font-mono); font-size:0.66rem; color:var(--navy-200); letter-spacing:0.1em; margin-top:2px; }
  .topbar-user{ display:flex; align-items:center; gap:10px; min-width:0; }
  .admin-user-name{ font-weight:600; font-size:0.88rem; color:var(--navy-200); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px; }
  .admin-role-pill{
    font-family:var(--font-mono); font-size:0.66rem; text-transform:uppercase; letter-spacing:0.06em;
    background:rgba(246,250,253,0.14); border:1px solid rgba(246,250,253,0.22); color:#fff; padding:3px 9px; border-radius:99px; white-space:nowrap;
  }
  .topbar .btn-ghost{ color:#fff; border-color:rgba(246,250,253,0.3); }
  .topbar .btn-ghost:hover:not(:disabled){ border-color:var(--navy-200); background:rgba(255,255,255,0.08); }

  /* ---------- Buttons / form controls ---------- */
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:0.95rem; letter-spacing:0.005em;
    border-radius:12px; border:1.5px solid var(--line); padding:11px 20px; min-height:48px;
    background:var(--surface); color:var(--ink);
    display:inline-flex; align-items:center; justify-content:center; gap:8px; text-align:center; text-decoration:none;
    transition:transform 0.08s, filter 0.15s, background 0.15s, border-color 0.15s;
  }
  .btn:active:not(:disabled){ transform:scale(0.98); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn:hover:not(:disabled){ border-color:var(--accent-mid); }
  .btn-accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-accent:hover:not(:disabled){ filter:brightness(1.12); border-color:var(--accent); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:var(--danger); color:var(--surface); border-color:var(--danger); }
  .btn-sm{ padding:8px 14px; font-size:0.85rem; min-height:40px; border-radius:10px; }
  .btn-lg{ padding:16px 28px; font-size:1.1rem; min-height:58px; border-radius:16px; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px; box-shadow:var(--shadow); }
  .panel-head{ margin-bottom:14px; }
  .panel-head h2{ font-size:1.25rem; margin-bottom:4px; }
  .panel-sub{ color:var(--muted); margin:0; font-size:0.92rem; }

  .t-shell{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .t-content{ max-width:1320px; margin:0 auto; width:100%; flex:1 1 auto; padding:20px max(20px, env(safe-area-inset-right)) 48px max(20px, env(safe-area-inset-left)); }

  /* ---------- Library: sidebar tree + detail ---------- */
  .lib-layout{ display:grid; grid-template-columns:320px 1fr; gap:18px; align-items:start; }
  .lib-sidebar{ padding:14px; position:sticky; top:16px; max-height:calc(100dvh - 32px); overflow-y:auto; }
  .lib-tabs{ display:flex; gap:2px; padding:3px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); margin-bottom:12px; }
  .lib-tabs button{ flex:1 1 0; border:none; background:none; color:var(--muted); font-weight:600; font-size:0.82rem; padding:8px 4px; border-radius:99px; }
  .lib-tabs button.active{ background:var(--accent); color:var(--accent-ink); }
  .lib-group{ margin-bottom:2px; }
  .lib-group-head{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:none; border:none; padding:10px 6px; font-weight:600; font-size:0.88rem; color:var(--ink); text-align:left;
  }
  .lib-group-head:hover{ color:var(--accent); }
  .lib-group-head svg{ transition:transform 0.15s; flex-shrink:0; opacity:0.6; }
  .lib-group.open .lib-group-head svg{ transform:rotate(90deg); }
  .lib-group-items{ display:none; flex-direction:column; padding-left:4px; margin:0 0 6px; border-left:2px solid var(--line); }
  .lib-group.open .lib-group-items{ display:flex; }
  .lib-item{
    display:flex; align-items:baseline; gap:8px; background:none; border:none; text-align:left;
    padding:8px 10px; font-size:0.85rem; color:var(--ink); border-radius:8px; margin:0 0 0 6px;
  }
  .lib-item:hover{ background:var(--surface-2); }
  .lib-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .lib-item-num{ font-family:var(--font-mono); color:var(--muted); font-size:0.76rem; flex-shrink:0; }
  .lib-item.active .lib-item-num{ color:inherit; opacity:0.75; }
  .lib-item-rev{ font-size:0.62rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent-mid); flex-shrink:0; }

  .lib-detail{ min-height:60vh; }
  .lib-detail-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:50vh; text-align:center; color:var(--muted); gap:8px; }

  .lesson-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .lesson-eyebrow{ font-family:var(--font-mono); font-size:0.76rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent-mid); margin-bottom:6px; }
  .lesson-title{ font-size:1.6rem; }
  .lesson-title-uz{ color:var(--muted); font-size:0.98rem; margin-top:4px; }
  .lesson-badge{ display:inline-flex; align-items:center; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:99px; margin-top:8px; }

  .t-section{ margin-bottom:28px; }
  .t-section:last-child{ margin-bottom:0; }
  .t-section-title{ font-size:1.05rem; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .t-section-title svg{ opacity:0.6; flex-shrink:0; }

  .vocab-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .vocab-card{ border:1px solid var(--line); border-radius:var(--radius-s); padding:12px 14px; background:var(--surface-2); }
  .vocab-en{ font-weight:600; display:flex; align-items:center; gap:6px; }
  .vocab-uz{ color:var(--muted); font-size:0.86rem; margin-top:2px; }
  .vocab-ex{ font-size:0.82rem; margin-top:6px; font-style:italic; color:var(--ink); opacity:0.85; }
  .play-btn{ background:none; border:none; color:var(--accent-mid); padding:2px; display:inline-flex; flex-shrink:0; }
  .play-btn:hover{ color:var(--accent); }

  .dl-line{ display:flex; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .dl-line:first-child{ border-top:none; }
  .dl-speaker{ font-weight:700; flex:0 0 100px; color:var(--accent-mid); font-size:0.86rem; }
  .dl-text{ flex:1 1 auto; }
  .dl-uz{ color:var(--muted); font-size:0.86rem; margin-top:2px; }

  .grammar-box{ background:var(--surface-2); border-radius:var(--radius-s); padding:16px; }
  .grammar-box h3{ font-size:1rem; margin-bottom:8px; }
  .teach-box{ background:var(--accent-soft); border:1px dashed var(--accent-mid); border-radius:var(--radius-s); padding:16px; }
  .teach-box h3{ font-size:0.85rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent); margin-bottom:10px; }
  .teach-line{ margin:0 0 10px; font-size:0.92rem; }
  .teach-line:last-child{ margin-bottom:0; }

  .mistake-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .mistake-card{ border-radius:var(--radius-s); padding:14px; }
  .mistake-wrong{ background:rgba(192,57,43,0.1); border:1px solid var(--danger); }
  .mistake-right{ background:rgba(27,127,87,0.1); border:1px solid var(--accent-2); }
  .mistake-label{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin-bottom:6px; }
  .mistake-wrong .mistake-label{ color:var(--danger); }
  .mistake-right .mistake-label{ color:var(--accent-2); }
  .mistake-why{ margin-top:10px; font-size:0.9rem; color:var(--muted); }

  .qz-item{ padding:14px 0; border-top:1px solid var(--line); }
  .qz-item:first-child{ border-top:none; }
  .qz-q{ font-weight:600; margin-bottom:8px; }
  .qz-choice{ display:flex; align-items:center; gap:8px; padding:5px 0; font-size:0.92rem; color:var(--muted); }
  .qz-choice.correct{ color:var(--accent-2); font-weight:600; }

  .examples-list{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
  .examples-list li{ padding-bottom:10px; border-bottom:1px solid var(--line); }
  .examples-list li:last-child{ border-bottom:none; padding-bottom:0; }
  .ex-uz{ color:var(--muted); font-size:0.88rem; margin-top:2px; }

  @media (max-width:900px){
    .lib-layout{ grid-template-columns:1fr; }
    .lib-sidebar{ position:static; max-height:none; }
    .mistake-grid{ grid-template-columns:1fr; }
    .vocab-grid{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:560px){
    .vocab-grid{ grid-template-columns:1fr; }
    .panel{ padding:16px; }
  }

  /* ---------- Resume-hosting banner ---------- */
  .resume-banner{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--accent-soft); border:1px solid var(--accent-mid); border-radius:var(--radius-s);
    padding:14px 18px; margin-bottom:18px;
  }

  /* ---------- Stage (hosting a live class) ---------- */
  .stage-shell{ display:flex; flex-direction:column; gap:14px; min-height:calc(100dvh - 90px); }
  .stage-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px 18px; box-shadow:var(--shadow);
  }
  .stage-code-wrap{ display:flex; align-items:center; gap:10px; }
  .stage-code-label{ font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
  .stage-code{ font-family:var(--font-mono); font-weight:700; font-size:1.5rem; letter-spacing:0.12em; background:var(--surface-2); padding:4px 12px; border-radius:10px; }
  .stage-meta{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; font-size:0.86rem; color:var(--muted); }
  .stage-meta strong{ color:var(--ink); }
  .stage-meta-item{ display:flex; align-items:center; gap:6px; }

  .stage-slide{
    flex:1 1 auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l);
    box-shadow:var(--shadow); padding:min(6vw,48px); display:flex; flex-direction:column; justify-content:center;
    min-height:46vh;
  }
  .slide-eyebrow{ font-family:var(--font-mono); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--accent-mid); margin-bottom:10px; text-align:center; }
  .slide-title{ font-size:clamp(1.8rem,4.2vw,3rem); text-align:center; }
  .slide-title-uz{ font-size:clamp(1rem,2vw,1.3rem); color:var(--muted); text-align:center; margin-top:10px; }
  .slide-wt{ text-align:center; color:var(--muted); font-size:0.95rem; margin-top:14px; }

  .stage-vocab-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; overflow-y:auto; max-height:60vh; padding:4px; }
  .stage-dl{ display:flex; flex-direction:column; gap:14px; overflow-y:auto; max-height:60vh; padding:4px; }
  .stage-dl-line{ max-width:80%; padding:12px 16px; border-radius:16px; background:var(--surface-2); }
  .stage-dl-line.speaker-b{ align-self:flex-end; background:var(--accent-soft); }
  .stage-dl-speaker{ font-weight:700; font-size:0.8rem; color:var(--accent-mid); margin-bottom:4px; }
  .stage-dl-uz{ color:var(--muted); font-size:0.88rem; margin-top:4px; }

  .stage-grammar{ text-align:center; max-width:760px; margin:0 auto; }
  .stage-grammar h2{ font-size:clamp(1.4rem,3vw,2rem); margin-bottom:16px; }
  .stage-grammar p{ font-size:clamp(1rem,1.6vw,1.2rem); line-height:1.6; }

  .quiz-stage-q{ text-align:center; font-size:clamp(1.3rem,3vw,2.1rem); margin-bottom:28px; }
  .quiz-options{ display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:920px; margin:0 auto; width:100%; }
  .quiz-opt{
    display:flex; align-items:center; gap:12px; padding:20px 22px; border-radius:16px; border:none;
    font-size:clamp(1rem,1.6vw,1.25rem); font-weight:600; color:#fff; text-align:left; min-height:74px;
  }
  .quiz-opt-shape{ width:26px; height:26px; flex-shrink:0; }
  .quiz-opt:nth-child(1){ background:#C0392B; }
  .quiz-opt:nth-child(2){ background:#1A3D63; }
  .quiz-opt:nth-child(3){ background:#B7950B; }
  .quiz-opt:nth-child(4){ background:#1B7F57; }
  .quiz-opt.dim{ opacity:0.35; }
  .quiz-opt.correct{ outline:4px solid #1B7F57; opacity:1; }
  .quiz-opt-count{ margin-left:auto; font-family:var(--font-mono); font-size:0.95rem; opacity:0.9; }
  .quiz-closed-hint{ text-align:center; color:var(--muted); margin-top:20px; }

  .leaderboard-list{ list-style:none; margin:0; padding:0; max-width:560px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:8px; }
  .lb-row{ display:flex; align-items:center; gap:12px; padding:10px 16px; border-radius:12px; background:var(--surface-2); }
  .lb-row.rank-0{ background:linear-gradient(90deg,#F4D03F,transparent); font-weight:700; }
  .lb-rank{ font-family:var(--font-mono); width:28px; text-align:right; color:var(--muted); }
  .lb-name{ flex:1 1 auto; }
  .lb-score{ font-family:var(--font-mono); font-weight:700; }

  .stage-controls{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .stage-controls-side{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .quiz-countdown{ font-family:var(--font-mono); font-weight:700; font-size:1.1rem; min-width:2.4em; text-align:center; }

  .join-hint{ text-align:center; color:var(--muted); font-size:0.85rem; }
  .join-hint strong{ color:var(--ink); font-family:var(--font-mono); letter-spacing:0.08em; }

  @media (max-width:640px){
    .stage-shell{ min-height:auto; }
    .quiz-options{ grid-template-columns:1fr; }
    .stage-slide{ padding:22px 16px; }
    .stage-bar{ flex-direction:column; align-items:flex-start; }
  }

  #toast{
    position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom)); transform:translate(-50%,20px);
    background:var(--navy-900); color:var(--navy-50); padding:12px 20px; border-radius:14px;
    font-size:0.92rem; opacity:0; pointer-events:none; transition:opacity 0.25s, transform 0.25s;
    max-width:90vw; text-align:center; box-shadow:var(--shadow); z-index:200; border:1px solid var(--line);
  }
  :root[data-theme="dark"] #toast{ background:var(--navy-200); color:var(--navy-900); }
  #toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<div id="authRoot"></div>
<div id="appShell" hidden></div>
<div id="toast"></div>

<script src="../curriculum.js"></script>
<script src="../grammar.js"></script>
<script type="module" src="teachers.js"></script>
</body>
</html>
