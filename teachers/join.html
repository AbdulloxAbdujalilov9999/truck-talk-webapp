<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join a class — Truck Talk Teachers</title>
<meta name="theme-color" content="#1A3D63" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D2140" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; min-height:100dvh; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:16px; line-height:1.5;
  }
  h1,h2,h3{ font-family:var(--font-display); text-wrap:balance; margin:0; font-weight:600; }
  .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  [hidden]{ display:none !important; }
  button{ font-family:inherit; cursor:pointer; }
  input{ font-size:16px; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .wrap{ min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .j-header{
    background:var(--header-bg); color:var(--header-ink); padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .j-brand{ font-family:var(--font-display); font-weight:700; letter-spacing:0.05em; font-size:1.1rem; }
  .j-main{ flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px max(18px, env(safe-area-inset-right)) 20px max(18px, env(safe-area-inset-left)); }

  .j-card{ width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:28px; box-shadow:var(--shadow); }
  .j-title{ font-size:1.4rem; margin-bottom:6px; text-align:center; }
  .j-sub{ color:var(--muted); font-size:0.9rem; text-align:center; margin-bottom:22px; }
  .j-label{ font-size:0.76rem; color:var(--muted); margin:0 0 4px; text-transform:uppercase; letter-spacing:0.04em; display:block; }
  .j-input{
    width:100%; padding:14px; min-height:54px; border-radius:var(--radius-s); border:1.5px solid var(--line);
    background:var(--surface-2); color:var(--ink); font-family:var(--font-mono); font-size:1.4rem; text-align:center;
    letter-spacing:0.2em; text-transform:uppercase; margin-bottom:16px;
  }
  .j-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .j-name-input{ font-family:var(--font-body); letter-spacing:normal; text-transform:none; font-size:1rem; text-align:left; }
  .j-btn{
    width:100%; min-height:54px; border-radius:14px; border:none; background:var(--accent); color:var(--accent-ink);
    font-weight:700; font-size:1.05rem; margin-top:4px;
  }
  .j-btn:disabled{ opacity:0.5; }
  .j-error{ background:var(--danger); color:#fff; padding:10px 12px; border-radius:var(--radius-s); font-size:0.85rem; margin-bottom:14px; text-align:center; }

  /* ---------- Playing ---------- */
  .play-header{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s); padding:10px 16px; margin-bottom:16px; max-width:640px;
  }
  .play-score{ font-family:var(--font-mono); font-weight:700; font-size:1.2rem; }
  .play-rank{ font-size:0.8rem; color:var(--muted); }

  .wait-card{ text-align:center; max-width:420px; }
  .wait-card svg{ opacity:0.5; margin-bottom:14px; }

  .q-card{ width:100%; max-width:560px; }
  .q-text{ font-size:1.2rem; font-weight:600; text-align:center; margin-bottom:18px; }
  .q-options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .q-opt{
    min-height:90px; border-radius:16px; border:none; color:#fff; font-size:1.05rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:10px;
  }
  .q-opt:nth-child(1){ background:#C0392B; }
  .q-opt:nth-child(2){ background:#1A3D63; }
  .q-opt:nth-child(3){ background:#B7950B; }
  .q-opt:nth-child(4){ background:#1B7F57; }
  .q-opt.locked{ opacity:0.4; }
  .q-opt.mine{ outline:4px solid #fff; opacity:1; }
  .q-locked-hint{ text-align:center; color:var(--muted); margin-top:16px; }

  .result-card{ text-align:center; max-width:420px; }
  .result-verdict{ font-size:1.6rem; margin-bottom:10px; }
  .result-verdict.correct{ color:var(--accent-2); }
  .result-verdict.wrong{ color:var(--danger); }
  .result-points{ font-family:var(--font-mono); font-size:1.1rem; margin-bottom:6px; }

  .end-card{ text-align:center; max-width:420px; }
  @media (max-width:420px){ .q-options{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="j-header"><span class="j-brand">TRUCK TALK TEACHERS</span></header>
  <main class="j-main" id="joinRoot"></main>
</div>
<script src="../trucktalk/curriculum.js"></script>
<script src="../trucktalk/grammar.js"></script>
<script type="module" src="join.js"></script>
</body>
</html>
